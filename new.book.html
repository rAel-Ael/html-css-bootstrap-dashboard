<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="stylenewbook.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>nuovo libro</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark border-bottom border-body">
            <div class="container-fluid">
                <img src="img/duck.png" alt="logo">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarTogglerDemo02" aria-controls="navbarTogglerDemo02" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarTogglerDemo02">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Link</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" />
                        <button class="btn btn-outline-success" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
    <section class="container-form">
        <h2>Nuovo Libro</h2>
        <div class="row">
            <div class="col">
                Nome autore:<input type="text" class="form-control" placeholder="First name" aria-label="First name">
            </div>
            <div class="col">
                Cognome autore:<input type="text" class="form-control" placeholder="Last name" aria-label="Last name">
            </div>
        </div>
        <div class="col-12">
            <label for="inputbook" class="form-label">Titolo</label>
            <input type="text" class="form-control" id="inputbook" placeholder="Inserisci titolo libro">
            <p>Titolo versione italiana</p>
        </div>

        <div class="row">
            <div class="col">
                <label for="inputState" class="form-label">State</label>
                <select id="inputState" class="form-select">
                    <option selected>I pilastri della terra</option>
                    <option selected>I promessi sposi</option>
                    <option selected>Il signore degli anelli</option>
                    <option selected>Il codice Da Vinci</option>
                    <option selected>Il trono di spade</option>
                    <option selected>Il piccolo principe</option>
                    <option selected>La storia infinita</option>
                    <option selected>Harry Potter e la pietra filosofale</option>
                    <option selected>Scegli genere</option>
                </select>
            </div>
            <div class="col">
                <label for="inputanno" class="form-label">Anno di Pubblicazione</label>
                <input type="text" class="form-control" id="inputanno" placeholder="Inserisci Anno">
            </div>
            <div class="col">
                <label for="inputisbn" class="form-label">ISBN#</label>
                <input type="text" class="form-control" id="inputisbn" placeholder="Inserisci il codice ISBN#">
            </div>
            <div class="mb-3">
                <label for="exampleFormControlTextarea1" class="form-label">Note</label>
                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"
                    placeholder="Inserisci eventuali note sul libro"></textarea>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="gridCheck">
                <label class="form-check-label" for="gridCheck">
                    Disponibile anche in digitale
                </label>
            </div>
            <button type="button" class="btn btn-primary col-3">Aggiungi Libro</button>

        </div>
    </section>











</body>



</html>
